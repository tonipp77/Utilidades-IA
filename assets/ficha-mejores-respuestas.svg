<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1025"/>
      <stop offset=".6" stop-color="#24163a"/>
      <stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset=".5" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#e09f1f"/>
    </linearGradient>
    <radialGradient id="aura" cx=".85" cy=".1" r=".6">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .titulo { animation: brillar 3s ease-in-out infinite; }
    @keyframes brillar { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
    .chispa { animation: flotar 4s ease-in-out infinite; }
    .chispa.b { animation-delay: 1.3s; } .chispa.c { animation-delay: 2.6s; }
    @keyframes flotar { 0%,100% { opacity: 0; transform: translateY(6px); } 50% { opacity: 1; transform: translateY(-6px); } }
    .stat { fill: #2b1d44; stroke: #a855f7; stroke-width: 1.5; }
    .sn { fill: #c4b5fd; font-size: 11px; letter-spacing: 1.5px; text-anchor: middle; font-family: 'Segoe UI', system-ui, sans-serif; }
    .sv { fill: #fff; font-size: 30px; font-weight: bold; text-anchor: middle; }
    .sm { fill: #f5c542; font-size: 13px; text-anchor: middle; font-family: 'Segoe UI', system-ui, sans-serif; }
    .h { fill: #f5c542; font-size: 15px; letter-spacing: 3px; font-family: 'Segoe UI', system-ui, sans-serif; }
    .cn { fill: #fff; font-size: 16px; font-weight: bold; }
    .cd { fill: #cbd5e1; font-size: 12.5px; font-family: 'Segoe UI', system-ui, sans-serif; }
    .pie { fill: #94a3b8; font-size: 12px; font-style: italic; text-anchor: middle; }
  </style>

  <rect width="820" height="560" rx="22" fill="url(#fondo)"/>
  <rect width="820" height="560" rx="22" fill="url(#aura)"/>
  <rect x="8" y="8" width="804" height="544" rx="16" fill="none" stroke="url(#oro)" stroke-width="2"/>
  <rect x="15" y="15" width="790" height="530" rx="12" fill="none" stroke="#f5c542" stroke-opacity=".25" stroke-width="1" stroke-dasharray="2 6"/>

  <circle class="chispa" cx="720" cy="60" r="3" fill="#f5c542"/>
  <circle class="chispa b" cx="760" cy="95" r="2" fill="#14b8a6"/>
  <circle class="chispa c" cx="690" cy="105" r="2.5" fill="#a855f7"/>

  <text x="40" y="62" class="titulo" fill="url(#oro)" font-size="34" font-weight="bold" letter-spacing="2">MEJORES RESPUESTAS</text>
  <text x="40" y="90" fill="#c4b5fd" font-size="15" font-style="italic">Archimaga del Prompt · Nivel 0.1.0 · Alineamiento: Legal Útil</text>
  <text x="40" y="112" fill="#64748b" font-size="12" font-family="'Segoe UI', system-ui, sans-serif">Raza: Plugin de Claude Code · Trasfondo: harta de muros de texto · Idiomas: español, STE100, Mermaid</text>

  <!-- Atributos -->
  <g transform="translate(40,135)">
    <g><rect class="stat" width="112" height="92" rx="12"/><text x="56" y="22" class="sn">CONTEXTO</text><text x="56" y="58" class="sv">20</text><text x="56" y="80" class="sm">+5</text></g>
    <g transform="translate(124,0)"><rect class="stat" width="112" height="92" rx="12"/><text x="56" y="22" class="sn">CLARIDAD</text><text x="56" y="58" class="sv">19</text><text x="56" y="80" class="sm">+4</text></g>
    <g transform="translate(248,0)"><rect class="stat" width="112" height="92" rx="12"/><text x="56" y="22" class="sn">PRECISIÓN</text><text x="56" y="58" class="sv">19</text><text x="56" y="80" class="sm">+4</text></g>
    <g transform="translate(372,0)"><rect class="stat" width="112" height="92" rx="12"/><text x="56" y="22" class="sn">ANTIPELOTA</text><text x="56" y="58" class="sv">20</text><text x="56" y="80" class="sm">+5</text></g>
    <g transform="translate(496,0)"><rect class="stat" width="112" height="92" rx="12"/><text x="56" y="22" class="sn">VISTOSIDAD</text><text x="56" y="58" class="sv">18</text><text x="56" y="80" class="sm">+4</text></g>
    <g transform="translate(620,0)"><rect class="stat" width="120" height="92" rx="12" fill="#3b1220" stroke="#f43f5e"/><text x="60" y="22" class="sn" fill="#fda4af">PÁRRAFOS</text><text x="60" y="58" class="sv">3</text><text x="60" y="80" class="sm" fill="#fb7185">−4 (bien)</text></g>
  </g>

  <!-- Conjuros -->
  <text x="40" y="262" class="h">GRIMORIO · 6 CONJUROS + 1 FAMILIAR</text>
  <line x1="40" y1="272" x2="780" y2="272" stroke="#f5c542" stroke-opacity=".35"/>

  <g transform="translate(40,300)">
    <circle cx="8" cy="-5" r="6" fill="#f97316"/><text x="22" y="0" class="cn">Dictar</text>
    <text x="22" y="20" class="cd">Evocación · Componente V (literal). Ordena tu verborrea.</text>

    <circle cx="8" cy="50" r="6" fill="#38bdf8"/><text x="22" y="55" class="cn">Entrevista</text>
    <text x="22" y="75" class="cd">Adivinación · 5 preguntas, de una en una, con opciones.</text>

    <circle cx="8" cy="105" r="6" fill="#a3e635"/><text x="22" y="110" class="cn">Lenguaje técnico</text>
    <text x="22" y="130" class="cd">Transmutación · Muro de texto → manual de avión.</text>

    <circle cx="8" cy="160" r="6" fill="#e879f9"/><text x="22" y="165" class="cn">Diagrama</text>
    <text x="22" y="185" class="cd">Conjuración · Invoca flechas de siete colores.</text>
  </g>

  <g transform="translate(430,300)">
    <circle cx="8" cy="-5" r="6" fill="#facc15"/><text x="22" y="0" class="cn">Explicación visual</text>
    <text x="22" y="20" class="cd">Ilusión · Mini-web o vídeo con voz. Úsese y tírese.</text>

    <circle cx="8" cy="50" r="6" fill="#f43f5e"/><text x="22" y="55" class="cn">Revisor crítico</text>
    <text x="22" y="75" class="cd">Abjuración · Destierra al Mímico Adulador.</text>

    <circle cx="8" cy="105" r="6" fill="#14b8a6"/><text x="22" y="110" class="cn">Familiar: Píldora del día</text>
    <text x="22" y="130" class="cd">Te susurra un consejo cada vez que abres sesión.</text>

    <circle cx="8" cy="160" r="6" fill="#94a3b8"/><text x="22" y="165" class="cn">Invocación: Revisor limpio</text>
    <text x="22" y="185" class="cd">Subagente sin memoria del crimen. Imparcial.</text>
  </g>

  <text x="410" y="530" class="pie">Tirada de salvación contra alucinaciones: +7 · Inmune a la complacencia · Vulnerable a prompts de una línea</text>
</svg>
